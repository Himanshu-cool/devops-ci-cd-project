name: Multi-Job Pipeline

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Build Backend
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          cd Backend
          pip install -r requirements.txt
      
      - name: Build backend
        run: echo "Backend built successfully!"

  # Job 2: Build Frontend (runs in parallel with build-backend)
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd Frontend/frontend-app
          npm install
      
      - name: Build frontend
        run: |
          cd Frontend/frontend-app
          npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: Frontend/frontend-app/build/

  # Job 3: Test Backend (waits for build-backend)
  test-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          cd Backend
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          cd Backend
          pytest --verbose

  # Job 4: Test Frontend (waits for build-frontend)
  test-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd Frontend/frontend-app
          npm install
      
      - name: Run tests
        run: |
          cd Frontend/frontend-app
          npm test -- --watchAll=false

  # Job 5: Code Quality (runs in parallel with tests)
  code-quality:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Check code formatting
        run: echo "Running code quality checks..."
      
      - name: Security scan
        run: echo "Running security scan..."

  # Job 6: Integration Tests (waits for all tests to pass)
  integration-tests:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download frontend build
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: Frontend/frontend-app/build/
      
      - name: Run integration tests
        run: echo "Running integration tests..."
      
      - name: Test API endpoints
        run: echo "Testing API endpoints..."

  # Job 7: Deploy (only runs if all tests pass)
  deploy:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to staging
        run: echo "Deploying to staging environment..."
      
      - name: Run smoke tests
        run: echo "Running smoke tests..."
      
      - name: Notify success
        run: echo "✅ Deployment successful!"

  # Job 8: Notify (always runs, even if previous jobs fail)
  notify:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "🎉 All jobs completed successfully!"
          else
            echo "❌ Some jobs failed. Check the logs."
          fi
