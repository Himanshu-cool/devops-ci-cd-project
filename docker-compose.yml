version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: devops-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    networks:
      - devops-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend/frontend-app
      dockerfile: Dockerfile
    container_name: devops-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - devops-network
    restart: unless-stopped

networks:
  devops-network:
    driver: bridge
